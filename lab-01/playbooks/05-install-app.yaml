---
# Полный деплой: MariaDB + Flask + Gunicorn + Nginx + SSL
# Запуск: ansible-playbook playbooks/05-install-app.yml

- name: Deploy MariaDB on database servers
  hosts: app_servers
  become: yes
  gather_facts: yes

  roles:
    - role: mariadb

- name: Deploy Flask application on web servers
  hosts: web_servers
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Wait for MariaDB to be ready
      ansible.builtin.wait_for:
        host: "{{ app_db_host | default('192.168.1.12') }}"
        port: 3306
        timeout: 60
        delay: 5
      when: app_db_enabled | default(true)

    - name: Create log directory for application
      ansible.builtin.file:
        path: "/var/log/{{ app_name | default('simple_app') }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

  roles:
    - role: ssl
      when: ssl_enabled | default(false)
    - role: simple-app
    - role: nginx

  post_tasks:
    - name: Verify application is running
      ansible.builtin.uri:
        url: "http://localhost:{{ health_check_port | default(80) }}/health"
        status_code: 200
        timeout: 10
      register: health_check
      failed_when: false

    - name: Display deployment status
      ansible.builtin.debug:
        msg: |
          ============================================
          Deployment Status for {{ inventory_hostname }}
          ============================================
          Health Check: {{ '✅ PASSED' if health_check.status == 200 else '❌ FAILED' }}
          URL: https://{{ ansible_host }}
          ============================================
