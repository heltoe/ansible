---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Deploy Nginx site configuration
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "/etc/nginx/sites-available/{{ inventory_hostname }}.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Reload Nginx

- name: Enable Nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ inventory_hostname }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ inventory_hostname }}.conf"
    state: link
  notify: Reload Nginx

- name: Test Nginx configuration
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes

- name: Allow HTTP through firewall
  ansible.builtin.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS through firewall (when SSL is enabled)
  ansible.builtin.ufw:
    rule: allow
    port: '443'
    proto: tcp
  when: ssl_enabled | default(false)
