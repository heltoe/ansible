---
- name: Verify Nginx installation
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Nginx is installed
      ansible.builtin.package:
        name: nginx
        state: present
      check_mode: true
      register: pkg_check
      failed_when: pkg_check.changed == false # Если не установлен, будет ошибка

    - name: Check Nginx config is valid
      ansible.builtin.command: nginx -t
      register: nginx_test
      failed_when: nginx_test.rc != 0

    - name: Check Nginx is running and enabled
      ansible.builtin.systemd:
        name: nginx
      register: svc_check
      failed_when: svc_check.status.ActiveState != "active" or not svc_check.status.Enabled

    - name: Check port 80 is listening
      ansible.builtin.wait_for:
        port: 80
        timeout: 10
