---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - update
    - packages

- name: Upgrade all packages to latest version
  ansible.builtin.apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes
    force_apt_get: yes
  tags:
    - update
    - packages
