---
- name: Update apt cache before installing packages
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 0  # Принудительное обновление
  tags:
    - packages

- name: Install essential packages
  ansible.builtin.apt:
    name: "{{ essential_packages }}"
    state: present
    force_apt_get: yes
  tags:
    - packages
