---
- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.username }}"
    comment: "{{ item.comment }}"
    groups: "{{ item.groups }}"
    shell: "{{ item.shell }}"
    create_home: yes
    state: present
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: Set authorized keys for admin users
  ansible.builtin.authorized_key:
    user: "{{ item.username }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/ansible_key.pub') }}"
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: Allow sudo without password for admin users
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ item.username }}"
    line: "{{ item.username }} ALL=(ALL) NOPASSWD: ALL"
    state: present
    create: yes
    mode: '0440'
    validate: 'visudo -cf %s'
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.username }}"
