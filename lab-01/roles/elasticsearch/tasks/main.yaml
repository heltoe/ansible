---
- name: Clean broken and duplicate APT repositories
  ansible.builtin.shell: |
    grep -rlF "https://yandex.ru" /etc/apt/ | xargs -r sed -i '/https:\/\/yandex\.ru/d'
    grep -rlF "mirrors/elastic" /etc/apt/sources.list.d/ | xargs -r rm -f
  changed_when: false

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - wget
      - curl
      - gnupg2
      - openjdk-17-jdk
    state: present
    update_cache: yes

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Remove old GPG key if broken
  ansible.builtin.file:
    path: /etc/apt/keyrings/elasticsearch.gpg
    state: absent

- name: Add Elasticsearch APT repository (Yandex Mirror)
  ansible.builtin.apt_repository:
    repo: "deb [trusted=yes] https://mirror.yandex.ru/mirrors/elastic/8/ stable main"
    state: present
    filename: elasticsearch
    update_cache: false

- name: Install Elasticsearch
  ansible.builtin.apt:
    name: elasticsearch
    state: present
    update_cache: yes
  notify: Restart elasticsearch

- name: Deploy Elasticsearch configuration
  ansible.builtin.template:
    src: elasticsearch.yaml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: '0660'
  notify: Restart elasticsearch

- name: Configure JVM heap size
  ansible.builtin.copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    content: |
      -Xms1g
      -Xmx1g
    owner: root
    group: root
    mode: '0644'
  notify: Restart elasticsearch

- name: Enable and start Elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for Elasticsearch to be ready
  ansible.builtin.uri:
    url: "http://localhost:9200/_cluster/health"
    status_code: 200
  register: es_health
  retries: 30
  delay: 10
  until: es_health.status == 200

- name: Allow Elasticsearch port in firewall
  ansible.builtin.ufw:
    rule: allow
    port: '9200'
    proto: tcp
