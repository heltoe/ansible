---
- name: Restart SSH
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Restart Nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted

- name: Reboot server
  ansible.builtin.reboot:
    msg: "Rebooting after system update"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
