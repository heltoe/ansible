---
- name: Wait for services to stabilize
  ansible.builtin.wait_for:
    timeout: 10
  when: wait_after_update | default(true)

- name: Check HTTP service on web servers
  ansible.builtin.uri:
    url: "http://localhost:{{ http_port | default(80) }}"
    status_code: 200
    timeout: 10
  register: http_check
  failed_when: false
  when: "'web_servers' in group_names"

- name: Assert HTTP service is working
  ansible.builtin.assert:
    that:
      - http_check.status == 200
    fail_msg: "HTTP service is not responding on {{ inventory_hostname }}"
    success_msg: "HTTP service is working on {{ inventory_hostname }}"
  when: 
    - "'web_servers' in group_names"
    - http_check is defined

- name: Check application service on app servers
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port | default(8080) }}"
    status_code: 200
    timeout: 10
  register: app_check
  failed_when: false
  when: "'app_servers' in group_names"

- name: Assert application service is working
  ansible.builtin.assert:
    that:
      - app_check.status == 200
    fail_msg: "Application service is not responding on {{ inventory_hostname }}"
    success_msg: "Application service is working on {{ inventory_hostname }}"
  when:
    - "'app_servers' in group_names"
    - app_check is defined

- name: Perform custom health check script
  ansible.builtin.script: files/health_check.sh
  register: custom_health_check
  changed_when: false
  failed_when: false
  when: custom_health_check_enabled | default(false)

- name: Display health check results
  ansible.builtin.debug:
    msg: |
      ============================================
      Health Check Results
      ============================================
      Host: {{ inventory_hostname }}
      HTTP Check: {{ http_check.status | default('N/A') }}
      App Check: {{ app_check.status | default('N/A') }}
      Custom Check: {{ custom_health_check.rc | default('N/A') }}
      ============================================
