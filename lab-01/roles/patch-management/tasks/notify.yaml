---
- name: Send Telegram notification about update
  ansible.builtin.uri:
    url: "https://api.telegram.org/bot{{ telegram_bot_token }}/sendMessage"
    method: POST
    body_format: json
    body:
      chat_id: "{{ telegram_chat_id }}"
      text: |
        🔄 *Server Update Report*
        
        🖥 Host: {{ inventory_hostname }}
        📦 Packages Updated: {{ update_result.changed | default(false) }}
         Reboot Required: {{ reboot_required_after.stat.exists | default(false) }}
        ✅ Health Check: PASSED
        ⏰ Time: {{ ansible_date_time.iso8601 | default('N/A') }}
      parse_mode: markdown
  when: 
    - telegram_bot_token is defined
    - telegram_chat_id is defined
  failed_when: false

- name: Create local update report
  ansible.builtin.template:
    src: update_report.j2
    dest: "/tmp/update_report_{{ inventory_hostname }}_{{ ansible_date_time.epoch }}.txt"
    mode: '0644'
  when: generate_report | default(true)
