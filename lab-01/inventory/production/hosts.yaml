---
all:
  children:
    web_servers:
      hosts:
        web-01:
          ansible_host: 192.168.1.10
          server_type: web
          health_check_port: 80
          ssl_enabled: true
          app_db_enabled: true
          app_db_host: "192.168.1.12"
          gunicorn_bind: "127.0.0.1:8000"
        web-02:
          ansible_host: 192.168.1.11
          server_type: web
          health_check_port: 80
          ssl_enabled: true
          app_db_enabled: true
          app_db_host: "192.168.1.12"
          gunicorn_bind: "127.0.0.1:8000"
    app_servers:
      hosts:
        app-01:
          ansible_host: 192.168.1.12
          server_type: db
          mariadb_bind_address: "0.0.0.0"
    monitoring_servers:
      hosts:
        app-01:
          ansible-host: 192.168.1.12
    elk_servers:
      hosts:
        app-01:
          ansible-host: 192.168.1.12
  vars:
    ansible_user: x-outhink
    ansible_ssh_private_key_file: ~/.ssh/ansible_key
    ansible_python_interpreter: /usr/bin/python3
    gunicorn_bind: "127.0.0.1:8000"
    elasticsearch_host: "192.168.1.12"
    logstash_host: "192.168.1.12"
