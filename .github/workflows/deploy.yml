---
name: Deploy Infrastructure

on:
  push:
    branches: [master]
    paths:
      - 'lab-01/playbooks/**'
      - 'lab-01/roles/**'
      - 'lab-01/inventory/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target group (all, web_servers, app_servers)'
        required: true
        default: 'all'
      dry_run_only:
        description: 'Run in check mode only (no changes)'
        required: false
        default: 'false'

# Запрещаем параллельные деплои в production
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, sre-lab]
    environment: production
    defaults:
      run:
        working-directory: lab-01

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Ansible environment
        run: |
          source /home/x-outhink/ansible-lab/lab-01/.venv-ci/bin/activate
          ansible --version
          ansible all -m ping

      - name: Dry run (check mode)
        run: |
          source /home/x-outhink/ansible-lab/lab-01/.venv-ci/bin/activate
          ansible-playbook playbooks/05-install-app.yaml --check --diff

      - name: Run Canary Deployment
        run: |
          source /home/x-outhink/ansible-lab/lab-01/.venv-ci/bin/activate
          ansible-playbook playbooks/08-canary-deploy.yaml

      - name: 🧪 Run Integration Tests
        run: |
          echo "Testing full stack connectivity..."

          # 1. Тестируем, что Nginx проксирует запросы
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -k https://192.168.1.10/)
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Integration Test FAILED: Nginx did not return 200 OK"
            exit 1
          fi

          # 2. Тестируем, что приложение может читать из БД
          DB_RESPONSE=$(curl -s -k https://192.168.1.10/api/users)
          if echo "$DB_RESPONSE" | grep -q "error"; then
            echo "❌ Integration Test FAILED: App cannot connect to MariaDB"
            echo "Response: $DB_RESPONSE"
            exit 1
          fi

          echo "✅ All Integration Tests PASSED"

      - name: 📊 Generate Deployment Report
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║              🚀 DEPLOYMENT REPORT                        ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 Commit:    ${{ github.sha }}"
          echo "👤 Author:    ${{ github.actor }}"
          echo "🌿 Branch:    ${{ github.ref_name }}"
          echo "🕐 Time:      $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📂 Repo:      ${{ github.repository }}"
          echo "🔗 Workflow:  ${{ github.run_id }}"
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  ENDPOINTS STATUS"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          
          # Проверяем все ключевые endpoint'ы
          echo -n "  🔹 web-01 (192.168.1.10)  → "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k --max-time 5 https://192.168.1.10/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ $STATUS OK"
          else
            echo "❌ $STATUS FAIL"
          fi
          
          echo -n "  🔹 web-02 (192.168.1.11)  → "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k --max-time 5 https://192.168.1.11/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ $STATUS OK"
          else
            echo "❌ $STATUS FAIL"
          fi
          
          echo -n "  🔹 Prometheus (app-01)    → "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://192.168.1.12:9090/-/healthy)
          if [ "$STATUS" = "200" ]; then
            echo "✅ $STATUS OK"
          else
            echo "❌ $STATUS FAIL"
          fi
          
          echo -n "  🔹 Grafana (app-01)       → "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://192.168.1.12:3000/api/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ $STATUS OK"
          else
            echo "❌ $STATUS FAIL"
          fi
          
          echo -n "  🔹 Kibana (app-01)        → "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://192.168.1.12:5601/api/status)
          if [ "$STATUS" = "200" ]; then
            echo "✅ $STATUS OK"
          else
            echo "❌ $STATUS FAIL"
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  APPLICATION INFO"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          
          # Получаем версию приложения
          echo "  📋 App Version Info:"
          curl -s -k https://192.168.1.10/api/info 2>/dev/null | python3 -m json.tool 2>/dev/null || echo "    (unavailable)"
          echo ""
          
          # Проверяем БД
          echo "  🗄️  Database Users Count:"
          curl -s -k https://192.168.1.10/api/users 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'    Total users: {len(d.get(\"users\", []))}')" 2>/dev/null || echo "    (unavailable)"
          echo ""
          
          echo "═══════════════════════════════════════════════════════════"
          echo "  DEPLOYMENT RESULT"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "  ✅ DEPLOYMENT SUCCESSFUL"
            echo ""
            echo "  🎯 Next steps:"
            echo "     • Check Grafana: http://192.168.1.12:3000"
            echo "     • Check Kibana:  http://192.168.1.12:5601"
            echo "     • Check App:     https://192.168.1.10"
          else
            echo "  ❌ DEPLOYMENT FAILED"
            echo ""
            echo "  🔍 Investigate:"
            echo "     • Review logs above"
            echo "     • SSH to affected server"
            echo "     • Check systemctl status"
          fi
          echo ""
          echo "╚══════════════════════════════════════════════════════════╝"
          if [ "${{ job.status }}" = "success" ]; then
            echo "  📈 Prometheus Metrics (last 5 min):"
            echo -n "    CPU avg: "
            curl -s 'http://192.168.1.12:9090/api/v1/query?query=avg(rate(node_cpu_seconds_total%7Bmode%3D%22idle%22%7D%5B5m%5D))' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); v=float(d['data']['result'][0]['value'][1]); print(f'{100-v:.1f}% busy')" 2>/dev/null || echo "N/A"
          fi